command: ["uvicorn", "energy_theft_detection.backend.app:app", "--workers", "2"]
env:
  - name: "SQL_WAREHOUSE_ID"
    valueFrom: "warehouse"
  - name: "AI_GATEWAY_ENDPOINT"
    value: "energy-theft-bedrock-gateway"
  - name: "GEMINI_GATEWAY_ENDPOINT"
    value: "energy-theft-gemini-gateway"
  - name: "OPENAI_GATEWAY_ENDPOINT"
    value: "energy-theft-openai-gateway"
  - name: "LLAMA_GATEWAY_ENDPOINT"
    value: "energy-theft-llama-gateway"
  - name: "GENIE_SPACE_ID"
    value: ""  # GENIE_SPACE_ID
  - name: "MAS_ENDPOINT"
    value: ""  # MAS_ENDPOINT
  - name: "CATALOG"
    value: ""  # CATALOG
  - name: "SCHEMA_NAME"
    value: "energy_theft_protection"
  # --- Lakebase (operational serving). OFF by default; enabled per-target. ---
  - name: "LAKEBASE_ENABLED"
    value: "false"  # LAKEBASE_ENABLED
  - name: "LAKEBASE_INSTANCE_NAME"
    value: "energy-theft-lakebase"
  - name: "LAKEBASE_DATABASE"
    value: "databricks_postgres"
  - name: "LAKEBASE_SCHEMA"
    value: "revenue_protection"
  - name: "LAKEBASE_SERVING_TABLE"
    value: "anomaly_scores_serving"
